services:
  - type: web
    name: mk-packers-movers
    runtime: node
    buildCommand: bash build-combined.sh
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
        value: 10000
      - key: FAST2SMS_API_KEY
        sync: false
